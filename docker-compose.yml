services:
  api:
    build: .
    image: doccollab:latest
    container_name: doccollab_api
    ports:
      - "3000:3000"
    volumes:
      - ./server/logs:/usr/src/app/server/logs
      - ./server/tmp:/usr/src/app/server/tmp
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","node -e \"require('http').get('http://localhost:3000/api/health', res=>{if(res.statusCode!==200) process.exit(1)}).on('error', ()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - worker

  worker:
    build: ./docker/tex-worker
    image: doccollab-tex-worker:latest
    container_name: doccollab_worker
    restart: unless-stopped
    volumes:
      - ./server/tmp:/work/tmp
    healthcheck:
      test: ["CMD-SHELL","node -e \"const { execSync } = require('child_process'); try { execSync('pdflatex --version'); } catch(e){ process.exit(1); }\""]
      interval: 60s
      timeout: 15s
      retries: 2
      start_period: 10s
    command: ["sleep","infinity"]
